<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Música — La Caverna</title>
  <meta name="description" content="Música que escucho en La Caverna de Sánchez." />
  <link href="https://cdn.jsdelivr.net/npm/monaspace-font@0.0.2/argon.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="library-page section-music">
  <header class="site-header">
    <nav class="nav" aria-label="Principal">
      <a class="brand bracket-link" href="../index.html" aria-label="Inicio"><img src="../assets/logo.png" alt="La Caverna" class="brand-logo" /></a>
      <input id="nav-toggle" class="nav-toggle" type="checkbox" aria-label="Abrir menú" />
      <label class="nav-button bracket-link" for="nav-toggle">menu</label>
      <div class="nav-links">
        <a class="bracket-link" href="../index.html#archivo">Archivo</a>
        <a class="bracket-link" href="about.html">About</a>
        <a class="bracket-link" href="linktree.html">*</a>
      </div>
    </nav>
  </header>
  <main class="page collection-page music-page">
    <header class="collection-masthead">
      <div class="collection-heading">
        <h1>Música</h1>
      </div>
      <div class="section-object" data-object-art="music" aria-hidden="true"></div>
    </header>
    <section class="music-console" aria-label="Reproductor de música">
      <div class="music-player">
        <div class="music-deck">
          <div class="turntable" aria-label="Disco girando">
            <div class="disc" id="music-disc">
              <div class="disc-label" aria-hidden="true"></div>
              <div class="disc-shine"></div>
              <div class="disc-shine disc-shine-alt"></div>
            </div>
            <div class="tonearm" aria-hidden="true"><span></span></div>
          </div>

          <div class="music-now-playing">
            <h2 id="music-title">Selecciona una canción</h2>
            <p id="music-author">—</p>
            <div class="music-controls" aria-label="Controles de reproducción">
              <button type="button" class="music-control" data-music-action="previous" aria-label="Canción anterior">⏮</button>
              <span class="music-toggle-slot">
                <button id="music-play" type="button" class="music-control music-control-main" data-music-action="play" aria-label="Reproducir">▶</button>
                <button id="music-pause" type="button" class="music-control music-control-main" data-music-action="pause" aria-label="Pausar" hidden>⏸</button>
              </span>
              <button type="button" class="music-control" data-music-action="next" aria-label="Siguiente canción">⏭</button>
            </div>
          </div>
        </div>

        <div class="spotify-player" aria-hidden="true"><div id="spotify-player"></div></div>
      </div>

      <aside class="music-playlist-panel" aria-label="Lista de canciones">
        <ol class="music-playlist" id="music-playlist" aria-live="polite"></ol>
      </aside>
    </section>
  </main>
  <footer class="footer"><span>La Caverna de</span><span>Sánchez</span></footer>
  <script src="../script.js"></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
